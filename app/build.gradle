plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.timbre'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.timbre'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    androidResources {
        noCompress 'onnx'
    }
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
}
